name: Build plugin
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download Dalamud
        run: |
          curl -fsSL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          mkdir -p "$HOME/dalamud"
          unzip -q dalamud.zip -d "$HOME/dalamud"
          echo "DALAMUD_HOME=$HOME/dalamud" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build KinshipPlugin/KinshipPlugin.csproj -c Release
      - name: Collect the plugin files
        run: |
          ZIP=$(find KinshipPlugin/bin -name latest.zip | head -1)
          echo "Found package: $ZIP"
          mkdir -p out/KinshipPlugin
          unzip -q "$ZIP" -d out/KinshipPlugin
          ls -la out/KinshipPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: KinshipPlugin
          path: out/KinshipPlugin
